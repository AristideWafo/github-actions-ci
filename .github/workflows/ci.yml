name: CI [build + test]

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
     runs-on: ubuntu-22.04
     steps:
       - name: Checkout code
         uses: actions/checkout@v4

       - name: Set up JDK ${{ env.JAVA_VERSION }}
         uses: actions/setup-java@v4
         with:
           distribution: ${{ env.JAVA_DISTRIBUTION }}
           java-version: ${{ env.JAVA_VERSION }}
           cache: 'gradle'

       - name: Grant execute permission for gradlew
         run: chmod +x ./gradlew

       - name: Build with Gradle
         run: ./gradlew build -x test --no-daemon

       - name: Archive build artifacts
         uses: actions/upload-artifact@v4
         with:
           name: build-artifacts
           path: |
             build/libs/*.jar
             !build/libs/*-plain.jar
           retention-days: 7
  test:
    permissions:
      pull-requests: write
    runs-on: ubuntu-22.04
    needs: build
    env:
      DB_URL: 'jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1'
      DB_USERNAME: 'sa'
      DB_PASSWORD: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/jacoco/test/html/
            build/reports/tests/test/
          retention-days: 30

      - name: Upload JaCoCo coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 30

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: 📊 Code Coverage Report
          update-comment: true

      - name: Verify coverage threshold
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Check coverage threshold
        if: github.event_name == 'pull_request' && steps.jacoco.outputs.coverage-overall != ''
        run: |
          COVERAGE=${{ steps.jacoco.outputs.coverage-overall }}
          echo "Overall coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below 80% threshold!"
            exit 1
          fi
          echo "✅ Coverage check passed!"

  release:
    runs-on: ubuntu-22.04
    needs: [build, test]
#    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Infer version with Nyx
        id: nyx-infer
        run: |
          VERSION=$(./gradlew -q nyxInfer --no-daemon | grep 'Project version:' | awk '{print $3}')
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to infer version"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Run Nyx
        run: ./gradlew nyxMake nyxMark nyxPublish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.nyx-infer.outputs.version }}
          name: Release ${{ steps.nyx-infer.outputs.version }}
          body_path: build/CHANGELOG.md
          files: |
            build/libs/*.jar
            build/CHANGELOG-*.md