name: CI [build + test]

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

jobs:
  build:
     runs-on: ubuntu-22.04
     steps:
       - uses: actions/checkout@v3

       - name: Set up JDK 21
         uses: actions/setup-java@v3
         with:
           distribution: 'temurin'
           java-version: '21'

       - name: Grant execute permission for gradlew
         run: chmod +x ./gradlew

       - name: Build with Gradle
         run: ./gradlew build -x test

       - name: Archive production artifacts
         if: success() || failure()
         uses: actions/upload-artifact@v4
         with:
           name: production-artifacts
           path: build/libs/*.jar
  test:
    permissions:
      pull-requests: write
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew check

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
           name: test-reports
           path: |
             build/reports/jacoco/test/html/
             build/reports/tests/

      - name: Upload JaCoCo coverage XML for Code Coverage Summary
        uses: actions/upload-artifact@v4
        with:
           name: jacoco-xml
           path: build/reports/jacoco/test/jacocoTestReport.xml

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/**/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          update-comment: true

      - name: Fail PR if overall coverage is less than 80%
        if: ${{ steps.jacoco.outputs.coverage-overall < 80.0 }}
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Overall coverage is less than 80%!')
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet pour Nyx

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Nyx
        run: ./gradlew nyxMake nyxMark nyxPublish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Get version from Nyx
        id: version
        run: |
          VERSION=$(./gradlew -q nyxPrint | grep 'version:' | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifacts to release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: build/CHANGELOG.md
          files: |
            build/libs/*.jar
            build/CHANGELOG-*.md